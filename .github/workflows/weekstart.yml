name: Weekstart-briefing
on:
  schedule:
    - cron: '0 6 * * 1'   # elke maandag ~08:00 NL
  workflow_dispatch:
jobs:
  weekstart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verstuur weekstart-briefing
        env:
          CLINICMINDS_API_TOKEN: ${{ secrets.CLINICMINDS_API_TOKEN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          WEEKSTART_TO: ${{ vars.WEEKSTART_TO }}
        run: python scripts/weekstart.py
