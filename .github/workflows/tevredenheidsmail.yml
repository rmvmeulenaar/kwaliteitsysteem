name: Kwartaal tevredenheidsmailing
on:
  schedule:
    - cron: '0 9 1 1,4,7,10 *'   # 1e dag van elk kwartaal, 09:00 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: '1 = alleen tonen (veilig), 0 = echt versturen'
        default: '1'
        required: true
jobs:
  mailing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verstuur kwartaal-tevredenheidsmails
        env:
          CLINICMINDS_API_TOKEN: ${{ secrets.CLINICMINDS_API_TOKEN }}
          TYPEFORM_TOKEN: ${{ secrets.TYPEFORM_TOKEN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          TYPEFORM_FORM_KLANTTEVREDENHEID: ${{ vars.TYPEFORM_FORM_KLANTTEVREDENHEID }}
          DRY_RUN: ${{ github.event.inputs.dry_run || vars.DRY_RUN || '1' }}
        run: python scripts/tevredenheidsmail.py
